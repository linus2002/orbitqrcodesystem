# Fly.io. Deploy with:  fly launch --no-deploy  (once)  then  fly deploy
#
# Pick a region close to where packs are actually scanned - verification
# latency is what a patient standing in a pharmacy experiences.
app = "orbit-qr"
primary_region = "jnb"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Fallback store only. The data lives in Sanity: set the three values with
  #   fly secrets set SANITY_PROJECT_ID=... SANITY_DATASET=... SANITY_API_TOKEN=...
  # (secrets, never here).
  DB_FILE = "/data/qrshield.json"
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # No scale-to-zero: without Sanity configured, the fallback file on the
  # volume below has exactly one owner. `suspend` would be fine for the process, but
  # a cold start delays a patient's scan, so one machine stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# A Fly volume is attached to a single machine. Only scale past one machine
# once Sanity is configured - on the fallback file, a second machine would get
# a separate, diverging store.
[[mounts]]
  source = "orbit_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
