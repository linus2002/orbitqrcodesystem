# Fly.io. Deploy with:  fly launch --no-deploy  (once)  then  fly deploy
#
# Pick a region close to where packs are actually scanned - verification
# latency is what a patient standing in a pharmacy experiences.
app = "orbit-qr"
primary_region = "jnb"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_FILE = "/data/qrshield.db"
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # No scale-to-zero and no second machine: the SQLite file on the volume
  # below has exactly one owner. `suspend` would be fine for the process, but
  # a cold start delays a patient's scan, so one machine stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# A Fly volume is attached to a single machine. Never `fly scale count 2` with
# this layout - the second machine gets a separate, diverging database.
[[mounts]]
  source = "orbit_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
