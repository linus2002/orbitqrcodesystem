# Render blueprint. Create the service with New > Blueprint and point it at
# this repository; Render reads this file and provisions everything below.
#
# DATA: set SANITY_PROJECT_ID, SANITY_DATASET and SANITY_API_TOKEN in the
# Render dashboard (they are `sync: false` below, so they never live in this
# file). With them set, all data is in Sanity and the disk is unused.
#
# Without them the app falls back to a local file on the attached disk, which
# one instance owns - so numInstances stays at 1 unless Sanity is configured.
services:
  - type: web
    name: orbit-qr
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The free plan has no persistent disk, so a paid plan is required here.
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health

    disk:
      name: orbit-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /data/qrshield.json
      # The database. Secrets: entered in the dashboard, never committed.
      - key: SANITY_PROJECT_ID
        sync: false
      - key: SANITY_DATASET
        sync: false
      - key: SANITY_API_TOKEN
        sync: false
      # Session cookies over HTTPS only. Render terminates TLS for us.
      - key: COOKIE_SECURE
        value: "true"

      # Set this to the service's own https URL once Render assigns it. It is
      # baked into every printed QR code, so it must be right before any
      # code is printed - changing it later orphans every pack already out.
      - key: PUBLIC_BASE_URL
        sync: false

      # Generated once by Render and then held. CODE_SECRET signs the payload
      # of every code this installation mints: treat it as permanent and back
      # it up, because rotating it invalidates every code already printed.
      - key: SESSION_SECRET
        generateValue: true
      - key: CODE_SECRET
        generateValue: true
      - key: SMS_WEBHOOK_SECRET
        generateValue: true
